[package]
name = "toasty-driver-mssql"
version = "0.11.0"
description = "Microsoft SQL Server driver for Toasty"
authors.workspace = true
edition.workspace = true
homepage.workspace = true
keywords.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
categories.workspace = true
readme.workspace = true
documentation = "https://docs.rs/toasty-driver-mssql"
# `ext/` is the `toasty-driver-mssql-ext` subcrate: a workspace member that
# lives under this crate but is not part of its package.
exclude = ["ext"]

[features]
default = []

# This driver's codecs handle the extra scalar types unconditionally, so its
# `toasty-core`/`toasty-sql` dependencies already enable these. The names exist
# so `toasty`'s per-scalar feature flags can reference the driver uniformly with
# the other backends.
rust_decimal = ["toasty-core/rust_decimal", "toasty-sql/rust_decimal"]
bigdecimal = ["toasty-core/bigdecimal", "toasty-sql/bigdecimal"]
jiff = ["toasty-core/jiff", "toasty-sql/jiff"]
net = ["toasty-core/net", "toasty-sql/net"]

[dependencies]
async-trait.workspace = true
bigdecimal.workspace = true
jiff.workspace = true
mssql-tds = { git = "https://github.com/microsoft/mssql-rs", rev = "3248bcef5835ad93b907b231a92cfada81abe11a", default-features = false }
rust_decimal.workspace = true
toasty-core = { workspace = true, features = ["bigdecimal", "jiff", "net", "rust_decimal"] }
# Its schema diff engine, DDL statement AST, and the SQL Server serializer.
toasty-sql = { workspace = true, features = ["bigdecimal", "jiff", "net", "rust_decimal"] }
tokio = { workspace = true, features = ["net"] }
tracing.workspace = true
uuid.workspace = true

[lints]
workspace = true
